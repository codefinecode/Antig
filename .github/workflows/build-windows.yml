name: Build Windows
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
                    key: ${{ runner.os }}-cargo-v1
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build current GUI/backend
        shell: pwsh
        run: cargo build --release --bin ag_unlocker
      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target\release\ag_unlocker.exe release\AG_${{ github.ref_name }}.exe
          Get-FileHash release\AG_${{ github.ref_name }}.exe -Algorithm SHA256
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG_${{ github.ref_name }}_windows
          path: release\AG_${{ github.ref_name }}.exe
